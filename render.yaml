# Render Blueprint - Backend + Telegram
# Connect this repo in Render Dashboard: New → Blueprint
services:
  - type: web
    name: speedy-tags-api
    runtime: node
    plan: free

    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: TELEGRAM_DISPATCHERS
        sync: false
      - key: BOLDY_SOURCE
        sync: false
      - key: ONETIMESECRET_USERNAME
        sync: false
      - key: ONETIMESECRET_API_KEY
        sync: false
      - key: ONETIMESECRET_URL
        sync: false
      - key: ONETIMESECRET_LINK_BASE
        sync: false
      - key: ONETIMESECRET_PASSPHRASE
        sync: false
      - key: FALLBACK_DISPATCHER_ID
        sync: false
      - key: FALLBACK_GROUP_ID
        sync: false
      - key: FALLBACK_GROUP_NAME
        sync: false
      - key: FALLBACK_CLAIM_TIMEOUT_MS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Stripe webhook signing secret (whsec_...) — set in the Render dashboard.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      # Paid /tag flow: the krab-tag-bot upstream that renders the NJ temp-tag PDF,
      # and the Bearer key it requires. TAG_API_KEY must match krab-tag-bot's.
      - key: TAG_GENERATE_URL
        value: https://krab-tag-bot.onrender.com
      - key: TAG_API_KEY
        sync: false
      # Flat price (USD) charged for one temp tag on /tag. Defaults to 100.
      - key: TAG_PRICE_USD
        value: "100"
      # OpenAI key powers the /tag paste → structured-fields AI parser.
      - key: OPENAI_API_KEY
        sync: false
      # Interview form proxy target — must return {"ok":true} at /api/health (Render web service)
      - key: KRAB_INTERVIEWER_URL
        value: https://krab-interviewer-bot.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: KRABLEADS_INGEST_URL
        value: https://krab-issuer-admin.onrender.com/api/v1/leads/ingest
      - key: KRABLEADS_INGEST_API_KEY
        sync: false
